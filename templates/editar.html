<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Ideia — Gerenciador de Ideias de Publicações</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Gerenciador de Ideias de Publicações</h1>

        {# Mensagens de confirmação e erro #}
        {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% if mensagens %}
        <div class="mensagens">
            {% for categoria, mensagem in mensagens %}
            <p class="mensagem">{{ mensagem }}</p>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <section>
            <h2>Editar ideia</h2>
            <form action="{{ url_for('editar_salvar', id=publicacao.id) }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="form-grupo">
                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" name="titulo" value="{{ publicacao.titulo }}" maxlength="100" required>
                </div>

                <div class="form-grupo">
                    <label for="conteudo">Ideia:</label>
                    <textarea id="conteudo" name="conteudo" rows="4" maxlength="2000" required>{{ publicacao.conteudo }}</textarea>
                </div>

                <div class="form-acoes">
                    <button type="submit">Salvar ideia</button>
                    <a href="{{ url_for('index') }}">Cancelar</a>
                </div>
            </form>
        </section>
    </div>
</body>
</html>
